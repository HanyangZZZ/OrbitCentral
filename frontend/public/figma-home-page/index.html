<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: white; }
  .home-container {
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    background: white;
    padding-top: 40px;
  }
  .logo-block {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
    margin-bottom: 30px;
    width: 100%;
    max-width: 600px;
  }
  .logo-block img { width: 140px; height: 140px; object-fit: contain; }
  .logo-text { display: flex; flex-direction: column; gap: 6px; }
  .logo-text .orbit {
    color: black;
    font-size: 64px;
    font-family: 'Barlow', sans-serif;
    font-weight: 700;
    line-height: 1;
  }
  .logo-text .subtitle {
    color: black;
    font-size: 20px;
    font-family: 'SF Pro', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 300;
    font-style: italic;
    line-height: 1.3;
  }
  .search-wrap { width: 700px; max-width: 90%; margin-bottom: 30px; }
  #search-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #f8f8f8;
    border-radius: 12px;
    padding: 12px 18px;
  }
  #search-bar input {
    flex: 1; border: none; background: transparent;
    font-family: 'SF Pro', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    font-size: 16px; font-weight: 300; color: #0f172a; outline: none;
  }
  .ai-toggle-wrap {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'SF Pro', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    font-size: 12px; font-weight: 400; color: #1f2937; white-space: nowrap;
  }
  #ai-toggle-btn {
    width: 34px; height: 18px; border-radius: 999px; border: none;
    background: #d7d2c8; padding: 2px; display: inline-flex; align-items: center;
    cursor: pointer; transition: background 0.2s ease;
  }
  #ai-toggle-knob {
    width: 14px; height: 14px; border-radius: 50%; background: #ffffff;
    transform: translateX(0); transition: transform 0.2s ease; display: block;
  }
  .categories-grid {
    display: grid;
    grid-template-columns: repeat(3, 297px);
    gap: 20px 40px;
    justify-content: center;
  }
  .category-cell { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .category-box {
    width: 297px; height: 110px; background: #F0F0F0; border-radius: 10px;
    overflow: hidden;
  }
  .category-box img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .category-label {
    color: black;
    font-size: 14px;
    font-family: 'SF Pro', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    font-weight: 400;
    line-height: 16px;
  }
  .divider-h {
    width: 100%;
    max-width: 1011px;
    height: 0;
    border: none;
    border-top: 2px solid #EFECE3;
    margin: 10px 0;
  }
  .grid-row {
    display: flex;
    justify-content: center;
    gap: 0;
  }
  .grid-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 10px 40px;
    cursor: pointer;
    border-radius: 12px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .grid-col:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
  }
  .grid-col:not(:last-child) {
    border-right: 2px solid #EFECE3;
  }
</style>

<div class="home-container">
  <!-- Logo + Orbit -->
  <div class="logo-block">
    <img src="images/image_13_176x176.png" />
    <div class="logo-text">
      <div class="orbit">Orbit</div>
      <div class="subtitle">Your City, Personalized.</div>
    </div>
  </div>

  <!-- Search bar -->
  <div class="search-wrap">
    <div id="search-bar">
      <svg style="width:20px;height:20px;flex-shrink:0;" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="11" cy="11" r="6.5" stroke="#0f172a" stroke-width="2"/>
        <path d="M16.5 16.5L21 21" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input type="text" placeholder="Search" />
      <div class="ai-toggle-wrap">
        <span>Ask AI</span>
        <button id="ai-toggle-btn" onclick="toggleAI()" type="button">
          <span id="ai-toggle-knob"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- Row 1 -->
  <div class="grid-row" style="margin-bottom: 0; padding-bottom: 15px;">
    <div class="grid-col" data-category="food-drink">
      <div class="category-box"><img src="images/food-and-drinks.jpg" alt="Food & Drink" /></div>
      <span class="category-label">Food &amp; Drink</span>
    </div>
    <div class="grid-col" data-category="retail">
      <div class="category-box"><img src="images/retail.jpg" alt="Retail" /></div>
      <span class="category-label">Retail</span>
    </div>
    <div class="grid-col" data-category="entertainment">
      <div class="category-box"><img src="entertainment-cover.jpeg" alt="Entertainment" /></div>
      <span class="category-label">Entertainment</span>
    </div>
  </div>

  <!-- Horizontal divider -->
  <div class="divider-h"></div>

  <!-- Row 2 -->
  <div class="grid-row" style="margin-top: 0; padding-top: 15px; padding-bottom: 80px;">
    <div class="grid-col" data-category="personal-services">
      <div class="category-box"><img src="personal-services-cover.jpg" alt="Personal Services" /></div>
      <span class="category-label">Personal Services</span>
    </div>
    <div class="grid-col" data-category="home-services">
      <div class="category-box"><img src="home-services-cover.webp" alt="Home Services" /></div>
      <span class="category-label">Home Services</span>
    </div>
    <div class="grid-col" data-category="other">
      <div class="category-box"><img src="other-cover.jpg" alt="Other" /></div>
      <span class="category-label">Other</span>
    </div>
  </div>
</div>

<script>
  let aiOn = false;
  function toggleAI() {
    aiOn = !aiOn;
    const bar = document.getElementById('search-bar');
    const btn = document.getElementById('ai-toggle-btn');
    const knob = document.getElementById('ai-toggle-knob');
    if (aiOn) {
      bar.style.background = '#efece3';
      btn.style.background = '#4a70a9';
      knob.style.transform = 'translateX(16px)';
    } else {
      bar.style.background = '#f8f8f8';
      btn.style.background = '#d7d2c8';
      knob.style.transform = 'translateX(0)';
    }
  }

  // Category click → postMessage to parent Vue app
  document.querySelectorAll('.grid-col[data-category]').forEach(function(col) {
    col.addEventListener('click', function() {
      var cat = col.getAttribute('data-category');
      window.parent.postMessage({ type: 'category-click', category: cat }, '*');
    });
  });
</script>
