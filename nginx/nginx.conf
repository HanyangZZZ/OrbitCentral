# =============================================================================
# Nginx – reverse proxy for all FBLC services
# Virtual hosts:
#   orbitcentral.ca          → Frontend SPA (API demo page)
#   business.orbitcentral.ca → Django REST API + admin panel + static files
#   admin.orbitcentral.ca    → Adminer (DB web portal, basic auth)
#   flower.orbitcentral.ca   → Flower (Celery monitoring, basic auth)
# =============================================================================

# ── Upstreams ─────────────────────────────────────────────────────────────────
upstream django {
    server django:8000;
}

upstream adminer {
    server adminer:8080;
}

upstream flower {
    server flower:5555;
}

# ── Rate limiting zones ──────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api:10m      rate=20r/s;
limit_req_zone $binary_remote_addr zone=web_admin:10m rate=5r/s;

# ── Default – reject unknown Host headers ────────────────────────────────────
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# ══════════════════════════════════════════════════════════════════════════════
# Frontend SPA — orbitcentral.ca
# The API demo page for frontend developers to test endpoints interactively.
# ══════════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name orbitcentral.ca localhost 127.0.0.1;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10M;

    gzip on;
    gzip_types application/json text/plain application/javascript text/css;
    gzip_min_length 256;
    gzip_vary on;

    # API proxy — so the SPA can call /api/ without CORS issues
    location /api/ {
        limit_req zone=api burst=40 nodelay;

        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Frontend SPA (Vue)
    location / {
        root /app/frontend;
        try_files $uri $uri/ /index.html;
        expires 7d;
        add_header Cache-Control "public";
    }
}

# ══════════════════════════════════════════════════════════════════════════════
# API — business.orbitcentral.ca
# Frontend app will point here for all API calls.
# Also hosts Django admin panel and static files.
# ══════════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name business.orbitcentral.ca;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;

    client_max_body_size 10M;
    client_body_timeout 30s;
    client_header_timeout 30s;

    gzip on;
    gzip_types application/json text/plain application/javascript text/css;
    gzip_min_length 256;
    gzip_vary on;

    # Handle CORS preflight
    location @cors_preflight {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
        add_header Access-Control-Max-Age 86400;
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }

    # Static files (Django admin CSS/JS)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Django admin panel
    location /admin/ {
        limit_req zone=web_admin burst=10 nodelay;

        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # API endpoints
    location /api/ {
        limit_req zone=api burst=40 nodelay;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Root — redirect to API docs or return info
    location / {
        return 301 /api/;
    }
}

# ══════════════════════════════════════════════════════════════════════════════
# Adminer — admin.orbitcentral.ca
# ══════════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name admin.orbitcentral.ca;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    auth_basic "Adminer - Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;

    limit_req zone=web_admin burst=10 nodelay;

    location / {
        proxy_pass http://adminer;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ══════════════════════════════════════════════════════════════════════════════
# Flower — flower.orbitcentral.ca
# ══════════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name flower.orbitcentral.ca;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    limit_req zone=web_admin burst=10 nodelay;

    location / {
        proxy_pass http://flower;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
