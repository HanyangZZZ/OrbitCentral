    }
}

# ══════════════════════════════════════════════════════════════════════════════
# API — business.orbitcentral.ca (HTTPS)
# Frontend app will point here for all API calls.
# Also hosts Django admin panel and static files.
# ══════════════════════════════════════════════════════════════════════════════
server {
    listen 443 ssl;
    http2 on;
    server_name business.orbitcentral.ca;

    ssl_certificate     /etc/letsencrypt/live/orbitcentral.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orbitcentral.ca/privkey.pem;
    include /etc/nginx/ssl/ssl-params.conf;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Access-Control-Allow-Origin "https://orbitcentral.ca" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
    add_header Access-Control-Allow-Credentials "true" always;

    client_max_body_size 10M;
    client_body_timeout 30s;
    client_header_timeout 30s;

    gzip on;
    gzip_types application/json text/plain application/javascript text/css;
    gzip_min_length 256;
    gzip_vary on;

    # Static files (Django admin CSS/JS)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Django admin panel
    location /admin/ {
        limit_req zone=web_admin burst=10 nodelay;

        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # API endpoints
    location /api/ {
        limit_req zone=api burst=40 nodelay;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://orbitcentral.ca" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Root — redirect to API docs
    location / {
        return 301 /api/;
    }
}

# ══════════════════════════════════════════════════════════════════════════════
# Adminer — admin.orbitcentral.ca (HTTPS)
# ══════════════════════════════════════════════════════════════════════════════
server {
    listen 443 ssl;
    http2 on;
    server_name admin.orbitcentral.ca;

    ssl_certificate     /etc/letsencrypt/live/orbitcentral.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orbitcentral.ca/privkey.pem;
    include /etc/nginx/ssl/ssl-params.conf;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    auth_basic "Adminer - Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;

    limit_req zone=web_admin burst=10 nodelay;

    location / {
        proxy_pass http://adminer;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ══════════════════════════════════════════════════════════════════════════════
# Flower — celery.orbitcentral.ca (HTTPS)
# ══════════════════════════════════════════════════════════════════════════════
server {
    listen 443 ssl;
    http2 on;
    server_name celery.orbitcentral.ca;

    ssl_certificate     /etc/letsencrypt/live/orbitcentral.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orbitcentral.ca/privkey.pem;
    include /etc/nginx/ssl/ssl-params.conf;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    limit_req zone=web_admin burst=10 nodelay;

    location / {
        proxy_pass http://flower;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
