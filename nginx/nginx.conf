# =============================================================================
# Nginx – reverse proxy for all OrbitCentral services (HTTP + HTTPS)
# Virtual hosts:
#   orbitcentral.ca          → User-facing frontend SPA
#   test.orbitcentral.ca     → API demo frontend (debug/testing)
#   business.orbitcentral.ca → Django REST API + admin panel + static files
#   admin.orbitcentral.ca    → Adminer (DB web portal, basic auth)
#   celery.orbitcentral.ca   → Flower (Celery monitoring, basic auth)
#
# SSL certificates managed by certbot (Let's Encrypt).
# On first deploy, run:  make ssl-init
# Auto-renewal:           make ssl-renew  (or cron)
# =============================================================================

# ── Upstreams ─────────────────────────────────────────────────────────────────
upstream django {
    server django:8000;
}

upstream adminer {
    server adminer:8080;
}

upstream flower {
    server flower:5555;
}

# ── Rate limiting zones ──────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api:10m      rate=20r/s;
limit_req_zone $binary_remote_addr zone=web_admin:10m rate=5r/s;

# ── Default – reject unknown Host headers ────────────────────────────────────
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/default.crt;
    ssl_certificate_key /etc/nginx/ssl/default.key;

    return 444;
}

# ══════════════════════════════════════════════════════════════════════════════
# HTTP → HTTPS redirect + ACME challenge for all domains
# ══════════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name orbitcentral.ca test.orbitcentral.ca business.orbitcentral.ca admin.orbitcentral.ca celery.orbitcentral.ca;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check (stays on HTTP for Docker healthcheck)
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ══════════════════════════════════════════════════════════════════════════════
# User Frontend SPA — orbitcentral.ca (HTTPS)
# The main user-facing frontend application.
# ══════════════════════════════════════════════════════════════════════════════
server {
    listen 443 ssl;
    http2 on;
    server_name orbitcentral.ca;

    ssl_certificate     /etc/letsencrypt/live/orbitcentral.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orbitcentral.ca/privkey.pem;
    include /etc/nginx/ssl/ssl-params.conf;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 10M;

    gzip on;
    gzip_types application/json text/plain application/javascript text/css;
    gzip_min_length 256;
    gzip_vary on;

    # API proxy — so the SPA can call /api/ without CORS issues
    location /api/ {
        limit_req zone=api burst=40 nodelay;

        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Frontend SPA (Vue)
    location / {
        root /app/frontend;
        try_files $uri $uri/ /index.html;
        expires 7d;
    }
}

# ══════════════════════════════════════════════════════════════════════════════
# API Demo Frontend — test.orbitcentral.ca (HTTPS)
# The API demo page for developers to test endpoints interactively.
# ══════════════════════════════════════════════════════════════════════════════
