# =============================================================================
# FBLC Docker Compose
# Services: postgres, redis, django, celery, nginx, adminer, flower
# Usage: make up / make down / make logs
# =============================================================================

services:
  # ── PostgreSQL with pgvector + PostGIS ─────────────────────────────────────
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: fblc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE:-fblc}
      POSTGRES_USER: ${PG_USER:-fblc}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-fblc} -d ${PG_DATABASE:-fblc}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Redis (Celery broker + result backend) ─────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fblc-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Django (Gunicorn) ──────────────────────────────────────────────────────
  django:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fblc-django
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: server.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      # DB — either set DATABASE_URL (for Supabase) or use PG_* vars (for local PG)
      DATABASE_URL: ${DATABASE_URL:-}
      PG_DATABASE: ${PG_DATABASE:-fblc}
      PG_USER: ${PG_USER:-fblc}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_HOST: ${PG_HOST:-postgres}
      PG_PORT: ${PG_PORT:-5432}
      # App
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-false}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
      # OpenAI (for vector embeddings)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Google Places (for import_places command)
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      # Brevo (transactional email)
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-noreply@orbitcentral.ca}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-Orbit}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://orbitcentral.ca}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      # reCAPTCHA v3 (leave empty to disable)
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      RECAPTCHA_SCORE_THRESHOLD: ${RECAPTCHA_SCORE_THRESHOLD:-0.5}
      # Celery
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - static_files:/app/staticfiles
      - django_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    expose:
      - "8000"

  # ── Celery Worker (background task processor) ─────────────────────────────
  # Same image as Django — runs Celery instead of Gunicorn.
  # Processes tasks dispatched by Django views (e.g., Google Places imports).
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fblc-celery
    restart: unless-stopped
    command: celery -A server worker -l info --concurrency=2
    environment:
      DJANGO_SETTINGS_MODULE: server.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DATABASE_URL: ${DATABASE_URL:-}
      PG_DATABASE: ${PG_DATABASE:-fblc}
      PG_USER: ${PG_USER:-fblc}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_HOST: ${PG_HOST:-postgres}
      PG_PORT: ${PG_PORT:-5432}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      # Brevo (transactional email)
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-noreply@orbitcentral.ca}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-Orbit}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://orbitcentral.ca}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
    volumes:
      - django_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      # Celery worker doesn't serve HTTP — check if the process is alive
      test: ["CMD-SHELL", "celery -A server inspect ping --timeout 10 2>/dev/null | grep -q OK || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s

  # ── Flower (Celery monitoring dashboard) ───────────────────────────────────
  # Optional — provides a web UI to monitor tasks, workers, and queues.
  # Access at http://localhost:5555
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fblc-flower
    restart: unless-stopped
    command: celery -A server flower --port=5555 --basic-auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:?FLOWER_PASSWORD must be set}
    environment:
      DJANGO_SETTINGS_MODULE: server.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # Flower needs PG vars for the entrypoint DB wait, but doesn't use the DB
      PG_DATABASE: ${PG_DATABASE:-fblc}
      PG_USER: ${PG_USER:-fblc}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_HOST: ${PG_HOST:-postgres}
      PG_PORT: ${PG_PORT:-5432}
    expose:
      - "5555"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "-u", "${FLOWER_USER:-admin}:${FLOWER_PASSWORD}", "http://localhost:5555/api/workers"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Nginx (reverse proxy) ─────────────────────────────────────────────────
  # Routes all traffic: orbitcentral.ca → Django, admin.* → Adminer, flower.* → Flower
  # Handles SSL termination with Let's Encrypt certs.
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: fblc-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl/ssl-params.conf:/etc/nginx/ssl/ssl-params.conf:ro
      - ./nginx/ssl/default.crt:/etc/nginx/ssl/default.crt:ro
      - ./nginx/ssl/default.key:/etc/nginx/ssl/default.key:ro
      - ./nginx/ssl/orbitcentral.crt:/etc/letsencrypt/live/orbitcentral.ca/fullchain.pem:ro
      - ./nginx/ssl/orbitcentral.key:/etc/letsencrypt/live/orbitcentral.ca/privkey.pem:ro
      - static_files:/app/staticfiles:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - django
      - adminer
      - flower
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "--header=Host: orbitcentral.ca", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Adminer (DB web portal) ─────────────────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: fblc-adminer
    restart: unless-stopped
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  # ── Certbot (Let's Encrypt SSL certificates) ───────────────────────────────
  # Usage:
  #   make ssl-init    — first-time cert issuance
  #   make ssl-renew   — renew certs (runs as cron or manually)
  certbot:
    image: certbot/certbot:latest
    container_name: fblc-certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 6h & wait $${!}; done'"
    networks:
      - backend

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local
  static_files:
    driver: local
  django_logs:
    driver: local
  nginx_logs:
    driver: local
  certbot_certs:
    driver: local
  certbot_www:
    driver: local

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  backend:
    driver: bridge
